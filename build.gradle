// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.10'
    ext.compose_version = '1.10.2'
    ext.kotlinVersion = kotlin_version
    ext.hilt_version = '2.59'
    ext.dagger_version = ext.hilt_version
    rootProject.ext.set("publishable", true)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        def nav_version = '2.9.6'
        classpath libs.gradle
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath libs.firebase.crashlytics.gradle
        classpath libs.gradle.versions.plugin
        classpath libs.publish.plugin
        classpath libs.org.jacoco.core
        classpath libs.org.jacoco.agent
        classpath libs.kotlin.gradle.plugin
        classpath libs.kotlin.metadata.jvm
        classpath libs.google.services  // Google Services plugin
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.0' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0' apply false // this version matches your Kotlin version
}

allprojects {
    apply plugin: 'jacoco'
}

apply plugin: 'io.github.gradle-nexus.publish-plugin'

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

repositories {
    google()
}

apply from: 'ScatterRoutingService/scatterbrainSDK/scripts/publish-root.gradle'